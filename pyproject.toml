[project]
name = "vehicle-telemetry-diagnostic-agent"
version = "0.1.0"
description = "Fleet telemetry pipeline on AWS and a local RAG diagnostic agent that cites its sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["vtda-simulator"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["simulator"]

[tool.uv.sources]
vtda-simulator = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["integration: tests that need a running LocalStack (run with make test-int)"]

[tool.coverage.run]
source = ["simulator", "pipeline", "agent"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
