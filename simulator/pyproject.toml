[project]
name = "vtda-simulator"
version = "0.1.0"
description = "Chassis-focused fleet telemetry simulator for fictional Nordwind vans (docs/simulator-spec.md)."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "simulator"
